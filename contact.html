  <main>
    <article>

      <!-- 
        - #CONTACT
      -->

      <section class="section contact has-bg-image" aria-labelledby="contact-label"
        style="background-image: url('./assets/images/contact-bg.png')">
        <div class="container">

          <form action="https://formspree.io/f/xwpebglp" method="POST" class="contact-form">

            <h2 class="headline-sm" id="contact-label">Get in touch</h2>

            <p class="contact-text body-md">
              Our friendly team would love to hear from you.
            </p>

            <div class="wrapper">

              <div>
                <label for="name" class="label">First name</label>

                <input type="text" name="name" id="name" placeholder="Name *" required class="input-field">
              </div>

              <div>
                <label for="email" class="label">Your Email </label>

                <input type="email" name="email" id="email" placeholder="Email *" required class="input-field">
              </div>

            </div>

            <label for="subject" class="label">Subject</label>
            <input type="text" name="subject" id="subject" placeholder="Subject *" class="input-field">

            <label for="message" class="label">Your message </label>
            <textarea name="message" id="message" placeholder="Your message *" required class="input-field"></textarea>

            <button type="submit" class="btn btn-tertiary">Send Message</button>

          </form>

          <div class="contact-content">

            <figure class="contact-portrait">
              <img src="./assets/images/farhaad.png" width="581" height="657" loading="lazy"
                alt="Alifarhad, a full-stack web developer from Pakistan" class="w-100">
              <div class="celebration" aria-hidden="true">
                <span class="celebration-shape star" style="--x: 35%; --drift: -38px; --size: 18px; --delay: -0.4s; --duration: 4.2s; --spin: 220deg;"></span>
                <span class="celebration-shape dot" style="--x: 42%; --drift: 22px; --size: 11px; --delay: -2.8s; --duration: 4.8s; --spin: 160deg;"></span>
                <span class="celebration-shape diamond" style="--x: 48%; --drift: -55px; --size: 15px; --delay: -1.5s; --duration: 4.4s; --spin: 280deg;"></span>
                <span class="celebration-shape spark" style="--x: 55%; --drift: 48px; --size: 20px; --delay: -3.6s; --duration: 5s; --spin: 200deg;"></span>
                <span class="celebration-shape star" style="--x: 62%; --drift: 34px; --size: 14px; --delay: -2.1s; --duration: 4.5s; --spin: 300deg;"></span>
                <span class="celebration-shape dot" style="--x: 67%; --drift: -28px; --size: 9px; --delay: -0.9s; --duration: 4.1s; --spin: 180deg;"></span>
                <span class="celebration-shape spark" style="--x: 39%; --drift: 58px; --size: 16px; --delay: -4.1s; --duration: 5.2s; --spin: 240deg;"></span>
                <span class="celebration-shape diamond" style="--x: 58%; --drift: -44px; --size: 12px; --delay: -3.2s; --duration: 4.6s; --spin: 320deg;"></span>
                <span class="celebration-shape star" style="--x: 45%; --drift: 40px; --size: 10px; --delay: -1.9s; --duration: 3.9s; --spin: 260deg;"></span>
                <span class="celebration-shape dot" style="--x: 52%; --drift: -20px; --size: 13px; --delay: -4.5s; --duration: 5.1s; --spin: 140deg;"></span>
              </div>
            </figure>

            <ul class="contact-list">

              <li class="contact-item">

                <div class="item-icon" style="background-color: hsl(177, 39%, 72%)">
                  <ion-icon name="call" aria-hidden="true"></ion-icon>
                </div>

                <div>
                  <p class="label-lg">Phone / Whatsapp</p>

                  <a href="https://wa.me/+9232165112425" class="body-lg" target="_blank">+9232165112425</a>
                </div>

              </li>

              <li class="contact-item">

                <div class="item-icon" style="background-color: hsl(41, 99%, 64%)">
                  <ion-icon name="mail" aria-hidden="true"></ion-icon>
                </div>

                <div>
                  <p class="label-lg">Mail</p>

                  <a href="mail:contact@alifarhad.dev" class="body-lg">contact@alifarhad.dev</a>
                </div>

              </li>

              <li class="contact-item">

                <div class="item-icon" style="background-color: hsl(19, 97%, 85%)">
                  <ion-icon name="location" aria-hidden="true"></ion-icon>
                </div>

                <div>
                  <p class="label-lg">Visit My Studio</p>

                  <address class="body-lg">
                    Under Construction
                  </address>
                </div>

              </li>

            </ul>

          </div>
